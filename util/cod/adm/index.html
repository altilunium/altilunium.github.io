    <script>
        const publicVapidKey = 'BBFWBBzaPVaFY-gyCJwEjy521betREaHqgqRM3P2ve19-mrjlB8FXh4NYrqjb3-EC69zE6WTbON3t6Wvic0vqVY';

        document.getElementById('subscribe-btn').addEventListener('click', async () => {
            if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
                alert('Push messaging is not supported by your browser.');
                return;
            }

            try {
                const registration = await navigator.serviceWorker.register('sw.js');
                const permission = await window.Notification.requestPermission();
                
                if (permission !== 'granted') {
                    alert('Permission for notifications was denied.');
                    return;
                }

                const subscription = await registration.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: urlBase64ToUint8Array(publicVapidKey)
                });

                const response = await fetch('history.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(subscription)
                });

                const result = await response.json();
                if (result.status === 'success') {
                    document.getElementById('sub-btn-text').innerText = 'Notifications Enabled';
                    alert('Successfully subscribed to push notifications!');
                } else {
                    alert('Failed to save subscription on server.');
                }
            } catch (err) {
                console.error('Subscription error:', err);
                alert('An error occurred while enabling notifications.');
            }
        });

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }
    </script>
