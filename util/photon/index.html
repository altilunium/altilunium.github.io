<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Photon OSM Search & Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * {
    box-sizing: border-box;
  }
  body, html { 
    margin: 0; 
    padding: 0;
    height: 100%; 
    width: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    background-color: #f4f4f5;
    overflow: hidden;
  }
  #map { 
    height: 100%; 
    width: 100%; 
    z-index: 1; 
  }
  .search-card {
    position: absolute;
    top: 16px;
    left: 16px;
    z-index: 1000;
    width: 380px;
    max-width: calc(100vw - 32px);
    max-height: calc(100vh - 32px);
    display: flex;
    flex-direction: column;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(8px);
    border-radius: 16px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.12), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
    overflow: hidden;
    transition: all 0.3s ease;
  }
  .search-header {
    padding: 12px 14px;
    background: #ffffff;
    border-bottom: 1px solid #f4f4f5;
  }
  .search-input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }
  .search-icon {
    position: absolute;
    left: 12px;
    width: 18px;
    height: 18px;
    fill: #71717a;
    pointer-events: none;
  }
  input[type="text"] { 
    width: 100%; 
    padding: 10px 12px 10px 38px; 
    border: 1px solid #e4e4e7; 
    border-radius: 10px; 
    font-size: 0.95rem; 
    outline: none;
    background: #f4f4f5;
    transition: all 0.2s;
  }
  input[type="text"]:focus {
    border-color: #3b82f6;
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
  }
  .hint-text {
    font-size: 0.75rem;
    color: #71717a;
    margin-top: 8px;
    padding: 0 4px;
  }
  #scroll-area {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px 12px 12px;
    max-height: 60vh;
  }
  #scroll-area::-webkit-scrollbar {
    width: 6px;
  }
  #scroll-area::-webkit-scrollbar-thumb {
    background: #d4d4d8;
    border-radius: 3px;
  }
  #results-container {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .result-item { 
    padding: 10px 12px; 
    border: 1px solid #f4f4f5; 
    border-radius: 10px; 
    cursor: pointer; 
    background: white;
    transition: all 0.2s ease; 
  }
  .result-item:hover, .result-item.active { 
    border-color: #bfdbfe;
    background-color: #eff6ff;
  }
  .result-title { 
    font-weight: 600; 
    color: #18181b;
    font-size: 0.9rem;
    margin-bottom: 2px; 
  }
  .result-context { 
    font-size: 0.8rem; 
    color: #71717a; 
    line-height: 1.3;
  }
  #more-btn { 
    width: 100%; 
    margin-top: 8px; 
    padding: 10px;
    background: #f4f4f5; 
    color: #27272a;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 500;
    display: none; 
    transition: background-color 0.2s;
  }
  #more-btn:hover { 
    background: #e4e4e7; 
  }
  .toast { 
    position: fixed; 
    bottom: 24px; 
    left: 50%; 
    transform: translateX(-50%); 
    background: #18181b; 
    color: white; 
    padding: 10px 20px; 
    border-radius: 9999px; 
    font-size: 0.85rem;
    display: none; 
    box-shadow: 0 10px 25px -5px rgba(0,0,0,0.25);
    z-index: 2000;
  }

  @media (max-width: 640px) {
    .search-card {
      top: 12px;
      left: 12px;
      right: 12px;
      width: auto;
      max-width: none;
      max-height: 75vh;
    }
    #scroll-area {
      max-height: 45vh;
    }
  }


input[type="text"] {
  flex: 1;
}

.toggle-btn {
  background: none;
  border: none;
  padding: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #71717a;
  border-radius: 8px;
  margin-left: 4px;
  transition: background-color 0.2s;
}

.toggle-btn:hover {
  background-color: #e4e4e7;
}

.toggle-btn svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
  transition: transform 0.3s ease;
}

.search-card.collapsed #scroll-area,
.search-card.collapsed .hint-text {
  display: none;
}

.search-card.collapsed #toggle-icon {
  transform: rotate(180deg);
}


</style>
</head>
<body>

<div id="map"></div>

<div class="search-card">
  <div class="search-header">
    

    <div class="search-input-wrapper">
  <svg class="search-icon" viewBox="0 0 24 24">
    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
  </svg>
  <input type="text" id="search-input" placeholder="Search places..." autocomplete="off">
  <button type="button" id="toggle-btn" class="toggle-btn" title="Toggle search panel">
    <svg id="toggle-icon" viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
  </button>
</div>
    <div class="hint-text">Click to center map • Right-click to copy coordinates</div>
  </div>
  
  <div id="scroll-area">
    <div id="results-container"></div>
    <button id="more-btn">Load More Results</button>
  </div>
</div>

<div id="toast" class="toast">Copied to clipboard!</div>

<script>
  const map = L.map('map', { zoomControl: false }).setView([20, 0], 2);
  
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '© OpenStreetMap contributors'
}).addTo(map);

  let currentMarker = null;
  let allResults = [];
  let displayedCount = 0;
  const resultsPerLoad = 10;
  let typingTimer;
  
  const searchInput = document.getElementById('search-input');
  const resultsContainer = document.getElementById('results-container');
  const moreBtn = document.getElementById('more-btn');
  const toast = document.getElementById('toast');

  async function performSearch() {
    const query = searchInput.value.trim();
    if (!query) {
      resultsContainer.innerHTML = '';
      moreBtn.style.display = 'none';
      return;
    }

    resultsContainer.innerHTML = '<p style="color: #71717a; font-size: 0.85rem; padding: 4px;">Searching...</p>';
    moreBtn.style.display = 'none';
    displayedCount = 0;
    allResults = [];

    try {
      const response = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&limit=50`);
      const data = await response.json();
      
      if (data.features && data.features.length > 0) {
        resultsContainer.innerHTML = '';
        allResults = data.features;
        renderMore();
      } else {
        resultsContainer.innerHTML = '<p style="color: #71717a; font-size: 0.85rem; padding: 4px;">No results found.</p>';
      }
    } catch (error) {
      resultsContainer.innerHTML = '<p style="color: #ef4444; font-size: 0.85rem; padding: 4px;">Network error fetching data.</p>';
    }
  }

  function renderMore() {
    const slice = allResults.slice(displayedCount, displayedCount + resultsPerLoad);
    
    slice.forEach((feature) => {
      const props = feature.properties;
      const coords = feature.geometry.coordinates; 
      const lat = coords[1];
      const lon = coords[0];
      const gmapsFormat = `${lat}, ${lon}`;

      const item = document.createElement('div');
      item.className = 'result-item';
      
      const titleText = props.name || 'Unnamed Location';
      const contextParts = [props.street, props.city, props.state, props.country].filter(Boolean).join(', ');

      item.innerHTML = `
        <div class="result-title">${titleText}</div>
        <div class="result-context">${contextParts || 'No location details'}</div>
      `;

      item.addEventListener('click', () => {
        document.querySelectorAll('.result-item').forEach(el => el.classList.remove('active'));
        item.classList.add('active');
        
        map.flyTo([lat, lon], 15, { duration: 1.5 });
        
        if (currentMarker) map.removeLayer(currentMarker);
        currentMarker = L.marker([lat, lon]).addTo(map)
          .bindPopup(`<b>${titleText}</b><br>${contextParts}`)
          .openPopup();
      });

      item.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        navigator.clipboard.writeText(gmapsFormat).then(() => {
          showToast(`Copied: ${gmapsFormat}`);
        });
      });

      resultsContainer.appendChild(item);
    });

    displayedCount += slice.length;
    moreBtn.style.display = (displayedCount < allResults.length) ? 'block' : 'none';
  }

  function showToast(message) {
    toast.textContent = message;
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 2500);
  }

  searchInput.addEventListener('input', () => {
    clearTimeout(typingTimer);
    typingTimer = setTimeout(performSearch, 400);
  });

  moreBtn.addEventListener('click', renderMore);



const searchCard = document.querySelector('.search-card');
const toggleBtn = document.getElementById('toggle-btn');

toggleBtn.addEventListener('click', () => {
  searchCard.classList.toggle('collapsed');
});

searchInput.addEventListener('focus', () => {
  searchCard.classList.remove('collapsed');
});

// Add searchCard.classList.remove('collapsed'); inside performSearch() 
// and searchCard.classList.add('collapsed'); inside the result item click listener.

  
</script>
</body>
</html>
