<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text List Sorter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    textarea {
      width: 100%;
      height: 350px;
      padding: 12px;
      box-sizing: border-box;
      resize: vertical;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      font-family: monospace;
    }

    button {
      margin-top: 16px;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      opacity: 0.9;
    }

    @media (max-width: 700px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <h1>Text List Sorter</h1>

  <div class="container">
    <div>
      <h3>Input</h3>
      <textarea id="input" placeholder="Enter one item per line"></textarea>
    </div>

    <div>
      <h3>Sorted Output</h3>
      <textarea id="output" readonly></textarea>
    </div>
  </div>

  <button onclick="sortList()">Sort</button>

  <script>
    function sortList() {
      const input = document.getElementById("input").value;

      const sorted = input
        .split("\n")
        .map(line => line.trim())
        .filter(line => line.length > 0)
        .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }));

      document.getElementById("output").value = sorted.join("\n");
    }
  </script>
</body>
</html>
