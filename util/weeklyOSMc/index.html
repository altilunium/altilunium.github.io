<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel=icon type=image/png sizes=32x32 href=https://weeklyosm.eu/icons/favicon-32x32.png>
  <title>weeklyOSM Comments RSS</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface-hover: #222632;
      --border: #2a2f3d;
      --text: #e8eaed;
      --text-muted: #9aa0a6;
      --accent: #7c9cff;
      --accent-hover: #9bb3ff;
      --danger: #ff6b6b;
      --danger-hover: #ff8787;
      --success: #51cf66;
      --radius: 12px;
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 17, 23, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
    }

    .header-inner {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    h1 span {
      color: var(--accent);
      font-weight: 400;
      font-size: 0.9rem;
      margin-left: 0.5rem;
    }

    .actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    button {
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary {
      background: var(--accent);
      color: #0f1117;
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
    }
    .btn-danger:hover:not(:disabled) {
      background: var(--danger);
      color: #fff;
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover:not(:disabled) {
      background: var(--surface);
      color: var(--text);
    }

    .btn-sm {
      padding: 0.3rem 0.65rem;
      font-size: 0.8rem;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    .status {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .status.error { color: var(--danger); }

    .item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
      transition: border-color 0.15s;
    }
    .item:hover { border-color: #3a4050; }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }

    .item-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      line-height: 1.4;
    }
    .item-title:hover { color: var(--accent); }

    .item-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 0.9rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .item-meta .author {
      color: var(--accent);
      font-weight: 500;
    }

    .item-meta .time {
      opacity: 0.85;
    }

    .item-description {
      font-size: 0.95rem;
      line-height: 1.7;
      color: var(--text);
      word-break: break-word;
    }

    .item-description p { margin-bottom: 0.75rem; }
    .item-description p:last-child { margin-bottom: 0; }

    .item-description blockquote {
      border-left: 3px solid var(--accent);
      margin: 0.75rem 0;
      padding: 0.5rem 0 0.5rem 1rem;
      color: var(--text-muted);
      background: rgba(124, 156, 255, 0.05);
      border-radius: 0 6px 6px 0;
    }

    .item-description a {
      color: var(--accent);
      text-decoration: none;
    }
    .item-description a:hover { text-decoration: underline; }

    .item-description img {
      max-width: 100%;
      border-radius: 6px;
      margin: 0.5rem 0;
    }

    .item-footer {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
      padding-top: 0.9rem;
      border-top: 1px solid var(--border);
    }

    .raw-data {
      display: none;
      margin-top: 1rem;
      background: #0a0c10;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      overflow-x: auto;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 0.78rem;
      line-height: 1.5;
      color: #c9d1d9;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 320px;
      overflow-y: auto;
    }

    .raw-data.visible { display: block; }

    .empty-state {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
    }
    .empty-state p { margin-top: 0.5rem; font-size: 0.9rem; }

    .count-badge {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.2rem 0.7rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    @media (max-width: 600px) {
      header { padding: 0.85rem 1rem; }
      main { padding: 1rem; }
      .item { padding: 1rem; }
      .item-header { flex-direction: column; gap: 0.5rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>weeklyOSM Comments <span id="count" class="count-badge">0</span></h1>
      <div class="actions">
        <button class="btn-primary" id="btnFetch" onclick="fetchRSS()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          Fetch RSS
        </button>
        <button class="btn-danger" id="btnClearAll" onclick="clearAll()">
          Clear All
        </button>
      </div>
    </div>
  </header>

  <main>
    <div id="status" class="status">Loading stored items…</div>
    <div id="list"></div>
  </main>

  <script>
    const RSS_URL = 'https://weeklyosm.eu/comments/api/v1/rss/site?site=weeklyosm';
    const STORAGE_KEY = 'weeklyosm-comments-rss';

    // ---------- relative time ----------
    function relativeTime(dateStr) {
      const date = new Date(dateStr);
      if (isNaN(date)) return dateStr;

      const now = Date.now();
      const diff = Math.floor((now - date.getTime()) / 1000);

      if (diff < 0) return 'just now';
      if (diff < 60) return diff + 's ago';
      if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
      if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
      if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
      if (diff < 2592000) return Math.floor(diff / 604800) + 'w ago';
      if (diff < 31536000) return Math.floor(diff / 2592000) + 'mo ago';
      return Math.floor(diff / 31536000) + 'y ago';
    }

    // ---------- storage ----------
    function loadItems() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch {
        return [];
      }
    }

    function saveItems(items) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    // ---------- parse RSS ----------
    function parseRSS(xmlText) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(xmlText, 'text/xml');
      const items = [];

      doc.querySelectorAll('item').forEach(item => {
        const get = (tag) => {
          const el = item.querySelector(tag);
          return el ? el.textContent.trim() : '';
        };

        // Capture raw XML of this item
        const raw = new XMLSerializer().serializeToString(item);

        items.push({
          guid: get('guid') || get('link'),
          title: get('title'),
          link: get('link'),
          description: get('description'),
          author: get('author'),
          pubDate: get('pubDate'),
          raw
        });
      });

      return items;
    }

    // ---------- merge new items (dedupe by guid) ----------
    function mergeItems(existing, incoming) {
      const map = new Map();
      // Keep existing first so order is preserved for already-seen items
      existing.forEach(i => map.set(i.guid, i));
      incoming.forEach(i => {
        if (!map.has(i.guid)) map.set(i.guid, i);
      });
      // Sort by pubDate descending
      return Array.from(map.values()).sort((a, b) => {
        return new Date(b.pubDate) - new Date(a.pubDate);
      });
    }

    // ---------- decode HTML entities for description ----------
    function decodeDescription(html) {
      const ta = document.createElement('textarea');
      ta.innerHTML = html;
      return ta.value;
    }

    // ---------- render ----------
    function render() {
      const items = loadItems();
      const list = document.getElementById('list');
      const status = document.getElementById('status');
      const countEl = document.getElementById('count');

      countEl.textContent = items.length;

      if (items.length === 0) {
        status.style.display = 'block';
        status.className = 'status';
        status.textContent = 'No items yet. Click "Fetch RSS" to load comments.';
        list.innerHTML = '';
        return;
      }

      status.style.display = 'none';
      list.innerHTML = items.map((item, idx) => {
        const desc = decodeDescription(item.description);
        return `
          <article class="item" data-guid="${escapeAttr(item.guid)}">
            <div class="item-header">
              <a class="item-title" href="${escapeAttr(item.link)}" target="_blank" rel="noopener">${escapeHtml(item.title)}</a>
            </div>
            <div class="item-meta">
              <span class="author">${escapeHtml(item.author || 'Anonymous')}</span>
              <span class="time" title="${escapeAttr(item.pubDate)}">${relativeTime(item.pubDate)}</span>
            </div>
            <div class="item-description">${desc}</div>
            <div class="item-footer">
              <button class="btn-ghost btn-sm" onclick="toggleRaw(this)">Show Raw</button>
              <button class="btn-danger btn-sm" onclick="deleteItem('${escapeAttr(item.guid)}')">Delete</button>
            </div>
            <pre class="raw-data">${escapeHtml(item.raw)}</pre>
          </article>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function escapeAttr(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    // ---------- actions ----------
    function toggleRaw(btn) {
      const pre = btn.closest('.item').querySelector('.raw-data');
      const visible = pre.classList.toggle('visible');
      btn.textContent = visible ? 'Hide Raw' : 'Show Raw';
    }

    function deleteItem(guid) {
      let items = loadItems().filter(i => i.guid !== guid);
      saveItems(items);
      render();
    }

    function clearAll() {
      if (!confirm('Erase all stored items?')) return;
      localStorage.removeItem(STORAGE_KEY);
      render();
    }

    async function fetchRSS() {
      const btn = document.getElementById('btnFetch');
      const status = document.getElementById('status');
      btn.disabled = true;
      btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="spin"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg> Fetching…`;

      status.style.display = 'block';
      status.className = 'status';
      status.textContent = 'Fetching RSS feed…';

      try {
        // Use a CORS proxy if needed; try direct first
        let res = await fetch(RSS_URL);
        if (!res.ok) throw new Error('HTTP ' + res.status);

        const xml = await res.text();
        const incoming = parseRSS(xml);

        if (incoming.length === 0) {
          status.className = 'status error';
          status.textContent = 'Feed returned no items.';
          return;
        }

        const existing = loadItems();
        const merged = mergeItems(existing, incoming);
        saveItems(merged);
        render();

        const added = merged.length - existing.length;
        status.style.display = 'block';
        status.className = 'status';
        status.textContent = added > 0
          ? `Fetched ${incoming.length} items, added ${added} new.`
          : `Fetched ${incoming.length} items, no new comments.`;
        setTimeout(() => { if (status.textContent.includes('Fetched')) status.style.display = 'none'; }, 3000);
      } catch (err) {
        console.error(err);
        // Fallback: try allorigins CORS proxy
        try {
          status.textContent = 'Direct fetch failed, trying CORS proxy…';
          const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(RSS_URL);
          const res = await fetch(proxyUrl);
          if (!res.ok) throw new Error('Proxy HTTP ' + res.status);
          const xml = await res.text();
          const incoming = parseRSS(xml);
          const existing = loadItems();
          const merged = mergeItems(existing, incoming);
          saveItems(merged);
          render();
          const added = merged.length - existing.length;
          status.className = 'status';
          status.textContent = added > 0
            ? `Fetched ${incoming.length} items (via proxy), added ${added} new.`
            : `Fetched ${incoming.length} items (via proxy), no new comments.`;
          setTimeout(() => { if (status.textContent.includes('Fetched')) status.style.display = 'none'; }, 3000);
        } catch (err2) {
          status.className = 'status error';
          status.textContent = 'Failed to fetch: ' + (err2.message || err.message);
        }
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg> Fetch RSS`;
      }
    }

    // ---------- init ----------
    render();
  </script>
</body>
</html>
