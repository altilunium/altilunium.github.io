<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup Elimination Chain</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Noto Color Emoji', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .sidebar {
            width: 400px;
            background-color: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            gap: 1rem;
            z-index: 10;
            box-shadow: 4px 0 15px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease;
        }

        .sidebar.hidden {
            display: none;
        }

        h1 {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        p.description {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        textarea {
            width: 100%;
            flex-grow: 1;
            min-height: 120px;
            background-color: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.8rem;
            color: var(--text-main);
            font-family: monospace;
            font-size: 0.8rem;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
            white-space: pre;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        .stats-container {
            flex-shrink: 0;
            height: 250px;
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .stats-container h3 {
            font-size: 0.9rem;
            color: #818cf8;
            margin-bottom: 0.2rem;
        }

        #statsList {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            padding-right: 5px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 0.4rem 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .stat-value {
            font-weight: 600;
            color: var(--accent);
        }

        .stat-value.zero {
            color: var(--text-muted);
            font-weight: 400;
        }

        .button-group {
            display: flex;
            gap: 0.5rem;
        }

        button {
            flex: 1;
            background: linear-gradient(135deg, #0284c7, #4f46e5);
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        button.secondary {
            background: #334155;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.98);
        }

        .legend {
            background-color: rgba(15, 23, 42, 0.6);
            padding: 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .line-box {
            width: 25px;
            height: 3px;
        }

        .wc-line { background-color: #f59e0b; }
        .qual-line { border-top: 2px dashed #38bdf8; background: transparent; height: 0; }

        .main-content {
            flex-grow: 1;
            height: 100vh;
            position: relative;
        }

        #network {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .watermark {
            position: absolute;
            bottom: 15px;
            right: 20px;
            color: var(--text-muted);
            font-size: 0.8rem;
            pointer-events: none;
            opacity: 0.6;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h1>🏆 Elimination Chain</h1>
        <p class="description">Press <strong>Ctrl + .</strong> to toggle this sidebar. Arrow rules: Solid gold = World Cup, Dashed cyan = Qualifiers.</p>
        
        <textarea id="dataInput" oninput="generateFoodChain(false)">

        <div class="stats-container">
            <h3>📊 Current Possession</h3>
            <div id="statsList"></div>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="line-box wc-line"></div>
                <span>World Cup Elimination</span>
            </div>
            <div class="legend-item">
                <div class="line-box qual-line"></div>
                <span>Qualifier Elimination</span>
            </div>
        </div>

        <div class="button-group">
            <button onclick="generateFoodChain(false)">Floating Physics</button>
            <button class="secondary" onclick="generateFoodChain(true)">Tree Layout</button>
        </div>
    </div>

    <div class="main-content">
        <div id="network"></div>
        <div class="watermark">Drag nodes to rearrange • Scroll to zoom</div>
    </div>

    <script>
        // Feature 1: Toggle Sidebar using Ctrl + .
        window.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === '.') {
                e.preventDefault();
                document.querySelector('.sidebar').classList.toggle('hidden');
            }
        });

        const flagMap = {
            "afghanistan": "🇦🇫", "algeria": "🇩🇿", "aruba": "🇦🇼", "australia": "🇦🇺",
            "austria": "🇦🇹", "bahrain": "🇧🇭", "barbados": "🇧🇧", "belarus": "🇧🇾",
            "belgium": "🇧🇪", "belize": "🇧🇿", "bermuda": "🇧🇲", "bolivia": "🇧🇴",
            "bosnia and herzegovina": "🇧🇦", "brazil": "🇧🇷", "bulgaria": "🇧🇬", "canada": "🇨🇦",
            "chile": "🇨🇱", "china": "🇨🇳", "colombia": "🇨🇴", "costa rica": "🇨🇷",
            "croatia": "🇭🇷", "curacao": "🇨🇼", "czechia": "🇨🇿", "denmark": "🇩🇰",
            "dr. congo": "🇨🇩", "dr congo": "🇨🇩", "egypt": "🇪🇬", "el salvador": "🇸🇻",
            "equatorial guinea": "🇬🇶", "faroe islands": "🇫🇴", "fiji": "🇫🇯", "france": "🇫🇷",
            "georgia": "🇬🇪", "germany": "🇩🇪", "ghana": "🇬🇭", "gibraltar": "🇬🇮",
            "greece": "🇬🇷", "guatemala": "🇬🇹", "guyana": "🇬🇾", "haiti": "🇭🇹",
            "honduras": "🇭🇳", "hong kong": "🇭🇰", "india": "🇮🇳", "indonesia": "🇮🇩",
            "iraq": "🇮🇶", "ireland": "🇮🇪", "ivory coast": "🇨🇮", "jamaica": "🇯🇲",
            "japan": "🇯🇵", "jordan": "🇯🇴", "kosovo": "🇽🇰", "kuwait": "🇰🇼",
            "kyrgyztan": "🇰🇬", "kyrgyzstan": "🇰🇬", "liberia": "🇱🇷", "malawi": "🇲🇼",
            "mexico": "🇲🇽", "montenegro": "🇲🇪", "montserrat": "🇲🇸", "morocco": "🇲🇦",
            "namibia": "🇳🇦", "new caledonia": "🇳🇨", "new zealand": "🇳🇿", "nicaragua": "🇳🇮",
            "north korea": "🇰🇵", "norway": "🇳🇴", "oman": "🇴🇲", "pakistan": "🇵🇰",
            "palestine": "🇵🇸", "panama": "🇵🇦", "paraguay": "🇵🇾", "peru": "🇵🇪",
            "philippines": "🇵🇭", "portugal": "🇵🇹", "qatar": "🇶🇦", "romania": "🇷🇴",
            "saint lucia": "🇱🇨", "samoa": "🇼🇸", "sao tome and principe": "🇸🇹", "saudi arabia": "🇸🇦",
            "scotland": "🏴󠁧󠁢󠁳󠁣󠁴󠁿", "senegal": "🇸🇳", "south korea": "🇰🇷", "spain": "🇪🇸",
            "suriname": "🇸🇷", "sweden": "🇸🇪", "tahiti": "🇵🇫", "tajikistan": "🇹🇯",
            "trinidad and tobago": "🇹🇹", "tunisia": "🇹🇳", "turkiye": "🇹🇷", "turkmenistan": "🇹🇲",
            "uae": "🇦🇪", "united arab emirates": "🇦🇪", "uruguay": "🇺🇾", "uzbekistan": "🇺🇿",
            "vanuatu": "🇻🇺", "venezuela": "🇻🇪", "vietnam": "🇻🇳", "south africa": "🇿🇦", "singapore" : "🇸🇬", "thailand" : "🇹🇭", "iran" : "🇮🇷"
        };

        function getFlag(countryName) {
            const cleanName = countryName.toLowerCase().trim();
            return flagMap[cleanName] || "🏳️";
        }

        // Feature 2: Statistical Calculation Engine
        function calculateStats(nodesMap, edges) {
            const defeatersOf = {}; // Nations that defeated X
            const defeatedBy = {};  // Nations that X defeated
            
            for (const id of nodesMap.keys()) {
                defeatersOf[id] = new Set();
                defeatedBy[id] = new Set();
            }
            
            for (const edge of edges) {
                defeatersOf[edge.to].add(edge.from);
                defeatedBy[edge.from].add(edge.to);
            }
            
            const memo = {};
            // Post-order traversal to calculate accumulated sum recursively
            function getTotal(node, visited = new Set()) {
                if (visited.has(node)) return 1; // Basic fallback to prevent rare cyclic loops
                if (memo[node] !== undefined) return memo[node];
                
                visited.add(node);
                let val = 1; // Inherent possession base value of 1
                for (const loser of defeatedBy[node]) {
                    // Split the loser's full possession equally amongst all nations that defeated it
                    val += getTotal(loser, visited) / defeatersOf[loser].size;
                }
                visited.delete(node);
                
                memo[node] = val;
                return val;
            }
            
            const currentPossession = [];
            for (const [id, node] of nodesMap.entries()) {
                const accumulatedTotal = getTotal(id);
                // If a nation has been defeated, it currently holds 0. 
                const isDefeated = defeatersOf[id].size > 0;
                
                currentPossession.push({
                    name: node.label,
                    possession: isDefeated ? 0 : accumulatedTotal
                });
            }
            
            // Sort by largest possession first, then alphabetically
            currentPossession.sort((a, b) => b.possession - a.possession || a.name.localeCompare(b.name));
            
            const statsList = document.getElementById('statsList');
            statsList.innerHTML = '';
            
            currentPossession.forEach(stat => {
                const item = document.createElement('div');
                item.className = 'stat-item';
                
                const nameSpan = document.createElement('span');
                nameSpan.className = 'stat-name';
                nameSpan.textContent = stat.name;
                
                const countSpan = document.createElement('span');
                countSpan.className = 'stat-value' + (stat.possession === 0 ? ' zero' : '');
                
                let displayVal = stat.possession;
                if (displayVal % 1 !== 0) displayVal = displayVal.toFixed(2); // Keep decimals clean
                
                countSpan.textContent = displayVal;
                
                item.appendChild(nameSpan);
                item.appendChild(countSpan);
                statsList.appendChild(item);
            });
        }

        let network = null;

        function generateFoodChain(isTree = false) {
            const rawText = document.getElementById('dataInput').value;
            const lines = rawText.split(/\r?\n/);
            
            const nodesMap = new Map();
            const edges = [];

            function addNode(name) {
                if (!name) return null;
                const clean = name.trim();
                if (!clean) return null;
                const id = clean.toLowerCase();
                if (!nodesMap.has(id)) {
                    nodesMap.set(id, {
                        id: id,
                        label: `${getFlag(clean)} ${clean}`,
                        shape: 'box',
                        margin: 10,
                        color: {
                            background: '#1e293b',
                            border: '#475569',
                            highlight: { background: '#334155', border: '#38bdf8' },
                            hover: { background: '#334155', border: '#38bdf8' }
                        },
                        font: { color: '#f8fafc', size: 15, face: "'Inter', 'Noto Color Emoji', sans-serif" },
                        borderWidth: 2,
                        shadow: { enabled: true, color: 'rgba(0,0,0,0.4)', size: 8 }
                    });
                }
                return id;
            }

            lines.forEach(line => {
                if (!line.includes(':')) return;
                const [sourceRaw, targetsRaw] = line.split(':');
                const sourceId = addNode(sourceRaw);
                if (!sourceId) return;

                let remainingTargets = targetsRaw;
                const parenRegex = /\(([^)]+)\)/g;
                let match;

                while ((match = parenRegex.exec(targetsRaw)) !== null) {
                    const qualNations = match[1].split(/\s+-\s+/);
                    qualNations.forEach(nation => {
                        const targetId = addNode(nation);
                        if (targetId) {
                            edges.push({
                                from: sourceId,
                                to: targetId,
                                arrows: 'to',
                                color: { color: '#38bdf8', highlight: '#0284c7' },
                                dashes: [5, 5],
                                width: 2,
                                title: 'Eliminated in Qualifiers'
                            });
                        }
                    });
                }

                remainingTargets = remainingTargets.replace(/\([^)]+\)/g, '');
                const wcNations = remainingTargets.split(/\s+-\s+/);
                wcNations.forEach(nation => {
                    const targetId = addNode(nation);
                    if (targetId && targetId !== sourceId) {
                        edges.push({
                            from: sourceId,
                            to: targetId,
                            arrows: 'to',
                            color: { color: '#f59e0b', highlight: '#d97706' },
                            width: 3,
                            title: 'Eliminated in World Cup'
                        });
                    }
                });
            });

            // Trigger the statistical calculation
            calculateStats(nodesMap, edges);

            const container = document.getElementById('network');
            const data = {
                nodes: Array.from(nodesMap.values()),
                edges: edges
            };

            const options = {
                layout: isTree ? {
                    hierarchical: {
                        enabled: true,
                        direction: 'LR',
                        sortMethod: 'directed',
                        levelSeparation: 240,
                        nodeSpacing: 60
                    }
                } : { hierarchical: false },
                physics: isTree ? { enabled: false } : {
                    solver: 'barnesHut',
                    barnesHut: {
                        gravitationalConstant: -4000,
                        centralGravity: 0.3,
                        springLength: 160,
                        springConstant: 0.04,
                        damping: 0.2
                    },
                    stabilization: { iterations: 300 }
                },
                interaction: {
                    hover: true,
                    tooltipDelay: 150,
                    navigationButtons: true
                }
            };

            if (network) network.destroy();
            network = new vis.Network(container, data, options);
        }

        window.addEventListener('DOMContentLoaded', () => generateFoodChain(false));
    </script>
</body>
</html>
